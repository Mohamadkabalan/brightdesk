[project]
name = "brightdesk"
version = "0.1.0"
description = "Companion code for 'From Python Developer to Applied AI Engineer' — the Brightdesk Support Copilot."
readme = "README.md"
authors = [
    { name = "Mohamad", email = "mkabalane@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
brightdesk = "brightdesk.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100            

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]  